model:
  base_learning_rate: 2.0e-05
  target: sgm.models.diffusion.DiffusionEngine
  params:
    scale_factor: 0.18215
    disable_first_stage_autocast: true
    input_key: clean_latent
    ### match this with MVHumanNetLoader!
    use_sapiens_conditioning: [ "depth", "seg_masks" ]
    ###
    network_wrapper: sgm.modules.diffusionmodules.wrappers.SevaWrapper
    scheduler_config:
      target: sgm.lr_scheduler.LambdaLinearScheduler
      params:
        warm_up_steps: [ 1 ]
        cycle_lengths: [ 10000000000000 ]
        f_start: [ 1.0 ]
        f_max: [ 1.0 ]
        f_min: [ 1.0 ]
    denoiser_config:
      target: sgm.modules.diffusionmodules.denoiser.DiscreteDenoiser
      params:
        num_idx: 1000
        scaling_config:
          target: sgm.modules.diffusionmodules.denoiser_scaling.EpsScaling
        discretization_config:
          target: sgm.modules.diffusionmodules.discretizer.SevaDDPMDiscretization
          params:
            num_timesteps: 1000
            linear_start: 5.0e-06
            linear_end: 0.012
            log_snr_shift: 2.4
    network_config:
      target: seva.modules.lora_wrapper.SevaLoRAWrapper
      params:
        seva_model_config:
          target: seva.model.Seva
          params:
            load_pretrained: false # IMPORTANT: Set to false to avoid loading base weights that don't have IP-Adapter layers
            params:
              in_channels: 21 # 16 + 5 (post projection: 4[seg_masks] + 1[depth])
              model_channels: 320
              out_channels: 4
              num_frames: 8
              num_res_blocks: 2
              attention_resolutions: [ 4, 2, 1 ]
              channel_mult: [ 1, 2, 4, 4 ]
              num_head_channels: 64
              transformer_depth: [ 1, 1, 1, 1 ]
              context_dim: 1024
              dense_in_channels: 6
              dropout: 0.0
              unflatten_names: [ "middle_ds8", "output_ds4", "output_ds2" ]
              ckpt_path: null
              use_ip_adapter: True
              face_context_dim: 512 # This is the *input* dim to the projector
              use_id_head: False
              ip_lambda_weight: 1.0
        self_attn_rank: 256
        cross_attn_rank: 512
        alpha: 64.0
        dropout: 0.0
        target_modules:
        - TransformerBlockTimeMix
        - MultiviewTransformer
        - TransformerBlock
        keys_to_lora: [ q, k, v ]
        excluded_modules: []
        ff_rank: 128
        lora_for_face_attn_only: true # freeze all model weights except face attention (and LoRA)
        freeze_lora: false
    conditioner_config:
      target: sgm.modules.GeneralConditioner
      params:
        emb_models:
        - is_trainable: false
          ucg_rate: 0.0
          input_key: plucker
          target: sgm.modules.encoders.modules.IdentityEncoder
        - is_trainable: false
          ucg_rate: 0.0
          input_key: concat
          target: sgm.modules.encoders.modules.IdentityEncoder
        - is_trainable: false
          ucg_rate: 0.0
          input_key: replace
          target: sgm.modules.encoders.modules.IdentityEncoder
        - is_trainable: false
          ucg_rate: 0.0
          input_key: mask
          target: sgm.modules.encoders.modules.IdentityEncoder
        - is_trainable: false
          ucg_rate: 0.0
          input_keys:
          - frames
          - mask
          target: sgm.modules.encoders.modules.SevaFrozenOpenCLIPImageEmbedder
          params:
            unsqueeze_dim: true
        - is_trainable: true
          ucg_rate: 0.0
          input_key: arcface_embedding
          output_key: face_cond
          target: sgm.modules.encoders.modules.ArcFaceProjector
          params:
            input_dim: 512
            cross_attn_dim: 1024
            n_tokens: 16

    first_stage_config:
      target: sgm.modules.encoders.modules.SevaAutoencoder
      params:
        scale_factor: 1.0
    loss_fn_config:
      target: sgm.modules.diffusionmodules.loss.StandardDiffusionLoss
      params:
        loss_weighting_config:
          target: sgm.modules.diffusionmodules.loss_weighting.SimVSWeighting
        sigma_sampler_config:
          target: sgm.modules.diffusionmodules.sigma_sampling.DiscreteSampling
          params:
            num_idx: 1000
            discretization_config:
              target: sgm.modules.diffusionmodules.discretizer.SevaDDPMDiscretization
        face_weighting: 2.0
        arcface_loss_weight: 0.0
        arcface_gt_key: "arcface_embedding"
        background_downweight: 0.01
    sampler_config:
      target: sgm.modules.diffusionmodules.sampling.EulerEDMSampler
      params:
        num_steps: 50
        discretization_config:
          target: sgm.modules.diffusionmodules.discretizer.SevaDDPMDiscretization
        guider_config:
          target: seva.sampling.MultiviewCFG
          params:
            cfg_min: 1.2

data:
  target: seva.data.mvh_dataloader.MVHumanNetLoader
  params:
    root_dir: /workspace/datasetvol/mvhuman_data/mv_captures
    batch_size: 6
    num_workers: 4
    num_images: 8
    step_size: 60
    only_include: 100001-104499
    val_include: 104500-104800
    preload_path: /workspace/datasetvol/mvhuman_data/preload_paths/shards
    iclight_dataset_path: /workspace/datasetvol/mvhuman_data/relit_images
    infu_dataset_path: null
    face_bbox_dir: /workspace/datasetvol/mvhuman_data/unified_face_boxes
    arcface_embeddings_dir: /workspace/datasetvol/mvhuman_data/arcface_embeddings # New path for arcface embeddings
    ### match this with DiffusionEngine!
    use_sapiens_conditioning: [ "depth", "seg_masks" ]
    ###
    maximal_crop: true
    random_crop: true
    use_inconsistent: true
    ic_sampling_prob: 0.5
    fixed_sampling_ids: null
    exclude:
    - '102206'
    - '102207'

lightning:
  modelcheckpoint:
    params:
      every_n_train_steps: 5000
      save_on_train_epoch_end: false
      save_last: false
      save_top_k: -1
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        disabled: false
        enable_autocast: false
        batch_frequency: 250
        max_images: 8
        increase_log_steps: false
        log_first_step: false
        log_train: true
        log_images_kwargs:
          use_ema_scope: false
          N: 1
          n_rows: 2
  trainer:
    devices: 0,
    benchmark: false
    num_sanity_val_steps: 0
    accumulate_grad_batches: 1
    max_epochs: 500
    precision: 16-mixed
    check_val_every_n_epoch: 1
